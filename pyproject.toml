[project]
name = "ha-linksys-velop"
version = "0.1.0"
description = "Home Assistant integration for Linksys Velop MX-series mesh (local JNAP)"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "."
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.ha_linksys_velop --cov-report=term-missing"

[tool.coverage.run]
branch = true
